name: Build MT6833 Android 16 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel via GitHub Actions
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Workspace
      uses: actions/checkout@v4

    - name: Set Up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf libssl-dev libxml2-utils rsync zip libncurses5-dev python3

    - name: Clone Proton Clang Compiler
      run: |
        git clone https://github.com --depth=1 clang

    - name: Clone MT6833 Pre-Patched Kernel Source
      run: |
        git clone https://github.com --depth=1 -b lineage-21 source
        
    - name: Build Kernel Binary
      run: |
        cd source
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        # Generates configuration using the unified community config target
        make O=out CC=clang mt6833_defconfig
        
        # Compile the kernel zImage binary
        make -j$(nproc --all) O=out CC=clang

    - name: Package and Upload Output
      uses: actions/upload-artifact@v4
      with:
        name: MT6833-Android16-Kernel
        path: source/out/arch/arm64/boot/Image.gz-dtb
